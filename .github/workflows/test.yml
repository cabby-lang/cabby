# make test, on Linux and on a Mac, for every pull request and every push
# to main. What a computer hasn't got (a desktop's bus, a printer, a
# microphone) the tests skip, as they do at home.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install what Cabby builds with
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang pkg-config libffi-dev \
            libgtk-4-dev libavformat-dev libavcodec-dev libswscale-dev libswresample-dev \
            libsqlite3-dev libssl-dev libcurl4-openssl-dev xvfb dbus valgrind
      - name: Build
        run: make -j"$(nproc)"
      - name: Test
        run: make test

  mac:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install what Cabby builds with
        run: brew install libffi pkgconf sdl3 ffmpeg openssl
      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"
      - name: Test
        run: make test
